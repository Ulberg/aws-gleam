name = "aws_codegen"
version = "0.0.0"
target = "erlang"

# Internal-only Gleam package. Generates the typed AWS service modules
# under ../src/aws/services/ from Smithy 2.0 JSON models in
# ../vendor/aws-sdk-rust/aws-models/. Not published.

[dependencies]
gleam_stdlib = ">= 0.40.0 and < 2.0.0"
gleam_json = ">= 2.0.0 and < 4.0.0"
simplifile = ">= 2.0.0 and < 3.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
