services:
  localstack:
    image: localstack/localstack:3
    container_name: aws-sdk-gleam-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb,s3
      - DEBUG=0
      - PERSISTENCE=0
      - LS_LOG=warn
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
