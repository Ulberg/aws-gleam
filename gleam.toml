name = "aws"
version = "0.1.0"
target = "erlang"

# Development meta-package for the aws-gleam workspace. Not
# published to hex. It pulls in `aws_runtime` and (after regen)
# every per-service `aws_<svc>` package via path deps so the
# existing test suite under test/ — which exercises both runtime
# helpers and codegen-emitted service code — can keep running as
# a single `gleam test` invocation.
#
# Published packages live under runtime/ and services/<svc>/;
# `gleam publish` is run from those directories, not this one.

[dependencies]
gleam_aws_runtime = { path = "./runtime" }

# Per-service path deps. Add a new entry here whenever a test file
# imports `aws/services/<svc>` — the corresponding service package
# under services/<svc>/ has to be regenerated first via
# `./scripts/regen.sh <svc>` (the regen creates services/<svc>/
# automatically). Consumers using the published hex packages list
# only the services they actually import; this list is the union
# every test happens to reach.
gleam_aws_api_gateway = { path = "./services/api_gateway" }
gleam_aws_cloudwatch_logs = { path = "./services/cloudwatch_logs" }
gleam_aws_dynamodb = { path = "./services/dynamodb" }
gleam_aws_eks = { path = "./services/eks" }
gleam_aws_s3 = { path = "./services/s3" }
gleam_aws_sqs = { path = "./services/sqs" }
gleam_aws_transcribe_streaming = { path = "./services/transcribe_streaming" }

gleam_stdlib = ">= 0.40.0 and < 2.0.0"
gleam_otp = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_http = ">= 4.0.0 and < 5.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
gleam_json = ">= 2.0.0 and < 4.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
simplifile = ">= 2.0.0 and < 3.0.0"
