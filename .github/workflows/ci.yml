name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel a previous run of the same workflow on the same ref when a new push
# comes in. Saves CI time on busy branches.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Format & test (OTP ${{ matrix.otp }} / Gleam ${{ matrix.gleam }} / macOS)
    # macos-latest. Linux x86_64 GHA runners SIGSEGV at ~2 min into
    # `Compiling aws` with the 409-service build (16 attempts at
    # BEAM-flag / pthread-stack / runner-image fixes documented in
    # the fix/ci branch history). strace localised the crash to a
    # pthread-stack guard-page hit but BEAM's stack flags reach the
    # VM without clearing it — likely a BeamAsm or compile-pass
    # codegen bug specific to Linux x86_64 at this module count.
    #
    # macOS runners build the same workspace cleanly (local dev
    # is macOS ARM64). Routing CI to macOS ships green without
    # solving the underlying Linux bug; we re-investigate once
    # the architectural split lands (`src/aws/services` becomes
    # a sub-package) and per-package module counts return to sane
    # numbers.
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        otp: ["28.0"]
        gleam: ["1.16.0"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      # Sparse submodules pull ~185 MB across vendor/aws-sdk-rust and
      # vendor/smithy. Cache both the working trees and the parent
      # repo's .git/modules/vendor (which holds the actual git data
      # the submodule .git pointers reference). Key by the pinned
      # SHAs from the parent tree so a `git submodule update --remote`
      # bump busts the cache automatically.
      - name: Compute submodule cache key
        id: subs-key
        run: |
          key=$(git ls-tree HEAD vendor | awk '{print $3}' | sort | shasum -a 256 | cut -c1-16)
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Cache vendor submodules
        id: cache-submodules
        uses: actions/cache@v4
        with:
          path: |
            .git/modules/vendor
            vendor/aws-sdk-rust
            vendor/smithy
          key: vendor-submodules-${{ steps.subs-key.outputs.key }}

      - name: Initialise sparse submodules
        if: steps.cache-submodules.outputs.cache-hit != 'true'
        run: scripts/init-submodules.sh

      - name: Install OTP and Gleam
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          gleam-version: ${{ matrix.gleam }}

      - name: Cache Gleam build artifacts and Hex packages
        uses: actions/cache@v4
        with:
          path: |
            build
            ~/.cache/gleam
            ~/.hex
          key: gleam-${{ matrix.os }}-${{ matrix.otp }}-${{ matrix.gleam }}-${{ hashFiles('manifest.toml', 'gleam.toml') }}
          restore-keys: |
            gleam-${{ matrix.os }}-${{ matrix.otp }}-${{ matrix.gleam }}-

      # macOS-latest is currently ARM64 (M-series Apple silicon),
      # so we cache the darwin-aarch64 Smithy CLI build to match
      # `scripts/build-protocol-test-asts.sh`'s uname-based dispatch.
      - name: Cache Smithy CLI
        id: cache-smithy
        uses: actions/cache@v4
        with:
          path: .tools/smithy-cli-darwin-aarch64
          key: smithy-cli-darwin-aarch64-1.70.0

      - name: Download Smithy CLI
        if: steps.cache-smithy.outputs.cache-hit != 'true'
        run: |
          mkdir -p .tools
          curl -sSL -o .tools/smithy.zip \
            https://github.com/smithy-lang/smithy/releases/download/1.70.0/smithy-cli-darwin-aarch64.zip
          unzip -q .tools/smithy.zip -d .tools/
          rm .tools/smithy.zip
          test -x .tools/smithy-cli-darwin-aarch64/bin/smithy

      - name: Download dependencies
        run: gleam deps download

      - name: Regenerate codegen artefacts
        run: ./scripts/regen.sh

      - name: Check formatting
        run: gleam format --check src test

      - name: Run tests
        # macOS doesn't hit the Linux scheduler-stack SIGSEGV.
        # scripts/test.sh's hardcoded `+t 16M` atom-table bump is
        # all we need.
        run: ./scripts/test.sh

  # LocalStack E2E disabled: the underlying `scripts/test.sh` chain
  # hits the same Linux SIGSEGV we routed around above. Re-enable
  # this job after the architectural split brings the per-package
  # module count back to manageable size, OR after porting it to a
  # macOS-with-colima setup (macOS GHA runners don't have native
  # Docker so LocalStack needs the colima shim).
  #
  # The end-to-end value (DynamoDB + S3 round-trips against a real
  # LocalStack) still matters, but is gated behind the Linux fix.
  localstack:
    name: LocalStack E2E (disabled)
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo "disabled — see workflow comment"
