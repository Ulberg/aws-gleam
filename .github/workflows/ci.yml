name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel a previous run of the same workflow on the same ref when a new push
# comes in. Saves CI time on busy branches.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Format & test (OTP ${{ matrix.otp }} / Gleam ${{ matrix.gleam }})
    # macos-latest. 8 GB swap on a 16 GB ubuntu runner did NOT
    # clear the SIGSEGV (commit 80cfbb4 still hit exit 139 at the
    # same 2:08 mark). So the failure isn't a simple memory
    # ceiling — there's something deterministic in the BEAM
    # compile pipeline at this module count that 24 GB effective
    # memory doesn't help with. macOS runs the same workspace
    # cleanly, so we route there.
    #
    # On a hot codegen + build cache (no changes to vendor,
    # codegen, scripts, src, or test), the regen + compile steps
    # are no-ops — so the macOS runtime overhead per build is the
    # tax we pay only on the first run after a codegen-touching
    # commit.
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        otp: ["28.0"]
        gleam: ["1.16.0"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      # Sparse submodules pull ~185 MB across vendor/aws-sdk-rust and
      # vendor/smithy. Cache both the working trees and the parent
      # repo's .git/modules/vendor (which holds the actual git data
      # the submodule .git pointers reference). Key by the pinned
      # SHAs from the parent tree so a `git submodule update --remote`
      # bump busts the cache automatically.
      # Compute cache keys deterministically from git tree object IDs.
      # GitHub Actions' `hashFiles()` reads from disk and turned out
      # non-deterministic in this repo (codegen + build cache misses
      # between runs where only docs/ changed). `git ls-tree -r
      # HEAD <path>` returns sorted blob SHAs that ONLY depend on
      # tracked file content — same content ⇒ same hash, always.
      - name: Compute cache keys
        id: cache-keys
        run: |
          # macOS lacks `sha256sum`; `shasum -a 256` is universal.
          tree_hash() {
            git ls-tree -r HEAD -- "$@" | awk '{print $3}' | shasum -a 256 | cut -c1-16
          }

          subs=$(tree_hash vendor)
          codegen=$(tree_hash codegen/src codegen/gleam.toml codegen/manifest.toml \
                              scripts/regen.sh scripts/build-protocol-test-asts.sh scripts/extract-endpoints.sh \
                              test/protocol_tests/runner.gleam test/protocol_tests/dispatch.gleam \
                              test/protocol_tests/loader.gleam test/protocol_tests/cases.gleam)
          build=$(tree_hash codegen/src codegen/gleam.toml codegen/manifest.toml \
                            scripts/regen.sh scripts/build-protocol-test-asts.sh scripts/extract-endpoints.sh \
                            src test \
                            manifest.toml gleam.toml)
          deps=$(tree_hash manifest.toml gleam.toml)

          echo "subs=$subs"     | tee -a "$GITHUB_OUTPUT"
          echo "codegen=$codegen" | tee -a "$GITHUB_OUTPUT"
          echo "build=$build"   | tee -a "$GITHUB_OUTPUT"
          echo "deps=$deps"     | tee -a "$GITHUB_OUTPUT"

      - name: Cache vendor submodules
        id: cache-submodules
        uses: actions/cache@v4
        with:
          path: |
            .git/modules/vendor
            vendor/aws-sdk-rust
            vendor/smithy
          key: vendor-submodules-${{ steps.cache-keys.outputs.subs }}

      - name: Initialise sparse submodules
        if: steps.cache-submodules.outputs.cache-hit != 'true'
        run: scripts/init-submodules.sh

      - name: Install OTP and Gleam
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          gleam-version: ${{ matrix.gleam }}

      # Hex package cache: deps from manifest.toml. Cheap, rarely
      # invalidates. Split out from `build/` so dep restore survives
      # build-cache misses.
      - name: Cache Hex packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/gleam
            ~/.hex
          key: hex-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.gleam }}-${{ steps.cache-keys.outputs.deps }}
          restore-keys: |
            hex-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.gleam }}-

      # Build artefacts cache. Keyed on every input that affects
      # what gleam build produces:
      #   * The codegen output (covered by `subs-key` + the codegen
      #     hash below — same inputs as the codegen cache)
      #   * Hand-written src/test source files
      #   * gleam.toml / manifest.toml (deps + target)
      # When the key matches exactly, the restored `build/` already
      # has bit-identical .beam files and gleam test does zero
      # compile work. When only some source files changed,
      # `restore-keys` falls back to the most recent build/ for the
      # same os/otp/gleam triple and gleam's incremental compile
      # handles the delta.
      - name: Cache Gleam build artifacts
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.gleam }}-${{ steps.cache-keys.outputs.subs }}-${{ steps.cache-keys.outputs.build }}
          restore-keys: |
            build-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.gleam }}-${{ steps.cache-keys.outputs.subs }}-
            build-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.gleam }}-

      # macos-latest is ARM64 (Apple silicon). scripts/build-protocol-
      # test-asts.sh dispatches on uname -m and picks the matching
      # smithy-cli archive automatically.
      - name: Cache Smithy CLI
        id: cache-smithy
        uses: actions/cache@v4
        with:
          path: .tools/smithy-cli-darwin-aarch64
          key: smithy-cli-darwin-aarch64-1.70.0

      - name: Download Smithy CLI
        if: steps.cache-smithy.outputs.cache-hit != 'true'
        run: |
          mkdir -p .tools
          curl -sSL -o .tools/smithy.zip \
            https://github.com/smithy-lang/smithy/releases/download/1.70.0/smithy-cli-darwin-aarch64.zip
          unzip -q .tools/smithy.zip -d .tools/
          rm .tools/smithy.zip
          test -x .tools/smithy-cli-darwin-aarch64/bin/smithy

      - name: Download dependencies
        run: gleam deps download

      # The 409-service regen takes ~11 min on macOS (each `gleam run
      # -m aws_codegen` is a fresh BEAM start). Its output is a pure
      # function of:
      #   * vendor/aws-sdk-rust submodule HEAD (the source data)
      #   * codegen/** (the codegen logic + deps)
      #   * scripts/regen.sh + scripts/build-protocol-test-asts.sh
      #     + scripts/extract-endpoints.sh
      #   * The hand-written test/protocol_tests/*.gleam files
      #     (runner, dispatch, loader, cases — they share a directory
      #     with the generated `_dispatchers.gleam` and the cache
      #     restore would overwrite them on hit; so they go in the
      #     key so the cache invalidates whenever they're edited).
      #
      # Cache key uses `git ls-tree`-based hashing (computed in the
      # "Compute cache keys" step at the top of the job) to avoid
      # GHA `hashFiles()` non-determinism that caused cache misses
      # between docs-only commits. On cache hit, the entire regen
      # step is a no-op (literally `if: false`) and the subsequent
      # gleam test build/ cache lines up with bit-identical src
      # files — so gleam test skips compilation too. Expected:
      # ~27 min → ~3-5 min on a hot cache.
      - name: Cache codegen output
        id: cache-codegen
        uses: actions/cache@v4
        with:
          path: |
            src/aws/services
            test/fixtures/protocol-tests
            test/fixtures/endpoints
            test/protocol_tests
          key: codegen-${{ runner.os }}-${{ steps.cache-keys.outputs.subs }}-${{ steps.cache-keys.outputs.codegen }}

      - name: Regenerate codegen artefacts
        if: steps.cache-codegen.outputs.cache-hit != 'true'
        run: ./scripts/regen.sh

      - name: Check formatting
        run: gleam format --check src test

      - name: Run tests
        run: ./scripts/test.sh

  # LocalStack E2E disabled: the underlying `scripts/test.sh` chain
  # hits the same Linux SIGSEGV we routed around above. Re-enable
  # this job after the architectural split brings the per-package
  # module count back to manageable size, OR after porting it to a
  # macOS-with-colima setup (macOS GHA runners don't have native
  # Docker so LocalStack needs the colima shim).
  #
  # The end-to-end value (DynamoDB + S3 round-trips against a real
  # LocalStack) still matters, but is gated behind the Linux fix.
  localstack:
    name: LocalStack E2E (disabled)
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo "disabled — see workflow comment"
