name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel a previous run of the same workflow on the same ref when a new push
# comes in. Saves CI time on busy branches.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Format & test (OTP ${{ matrix.otp }} / Gleam ${{ matrix.gleam }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        otp: ["28.0"]
        gleam: ["1.16.0"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      # Sparse submodules pull ~185 MB across vendor/aws-sdk-rust and
      # vendor/smithy. Cache both the working trees and the parent
      # repo's .git/modules/vendor (which holds the actual git data
      # the submodule .git pointers reference). Key by the pinned
      # SHAs from the parent tree so a `git submodule update --remote`
      # bump busts the cache automatically.
      - name: Compute submodule cache key
        id: subs-key
        run: |
          key=$(git ls-tree HEAD vendor | awk '{print $3}' | sort | sha256sum | cut -c1-16)
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Cache vendor submodules
        id: cache-submodules
        uses: actions/cache@v4
        with:
          path: |
            .git/modules/vendor
            vendor/aws-sdk-rust
            vendor/smithy
          key: vendor-submodules-${{ steps.subs-key.outputs.key }}

      - name: Initialise sparse submodules
        if: steps.cache-submodules.outputs.cache-hit != 'true'
        run: scripts/init-submodules.sh

      - name: Install OTP and Gleam
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          gleam-version: ${{ matrix.gleam }}

      - name: Cache Gleam build artifacts and Hex packages
        uses: actions/cache@v4
        with:
          path: |
            build
            ~/.cache/gleam
            ~/.hex
          key: gleam-${{ matrix.otp }}-${{ matrix.gleam }}-${{ hashFiles('manifest.toml', 'gleam.toml') }}
          restore-keys: |
            gleam-${{ matrix.otp }}-${{ matrix.gleam }}-

      # ./scripts/build-protocol-test-asts.sh shells out to the Smithy
      # CLI under .tools/. Cache the unpacked CLI by version so we
      # don't re-fetch ~50 MB every CI run. The CLI version must be
      # >= the Maven deps declared in .tools/smithy-build.json, or
      # the CLI refuses to load them.
      - name: Cache Smithy CLI
        id: cache-smithy
        uses: actions/cache@v4
        with:
          path: .tools/smithy-cli-linux-x86_64
          key: smithy-cli-linux-x86_64-1.70.0

      - name: Download Smithy CLI
        if: steps.cache-smithy.outputs.cache-hit != 'true'
        run: |
          mkdir -p .tools
          curl -sSL -o .tools/smithy.zip \
            https://github.com/smithy-lang/smithy/releases/download/1.70.0/smithy-cli-linux-x86_64.zip
          unzip -q .tools/smithy.zip -d .tools/
          rm .tools/smithy.zip
          test -x .tools/smithy-cli-linux-x86_64/bin/smithy

      - name: Download dependencies
        run: gleam deps download

      - name: Regenerate codegen artefacts
        # None of `src/aws/services/*`, `test/fixtures/endpoints/*`,
        # `test/fixtures/protocol-tests/*`, or the dispatcher modules
        # are tracked. The codegen + the two extract scripts produce
        # them deterministically from `vendor/aws-sdk-rust/aws-models`
        # and `vendor/smithy`.
        run: ./scripts/regen.sh

      - name: Check formatting
        run: gleam format --check src test

      - name: Pre-test diagnostics
        # If the BEAM segfaults during the test step, the post-mortem
        # log line tells us little. Snapshot memory / cpu / ulimit /
        # OTP build details here so the prior step's logs contain
        # everything needed to triage a crash.
        run: |
          echo "--- uname"; uname -a
          echo "--- free"; free -h || true
          echo "--- /proc/meminfo summary"; grep -E "^(MemTotal|MemFree|MemAvailable|SwapTotal)" /proc/meminfo || true
          echo "--- nproc"; nproc
          echo "--- ulimit"; ulimit -a || true
          echo "--- erlang"; erl -eval 'io:format("OTP ~s ERTS ~s schedulers ~p~n",[erlang:system_info(otp_release), erlang:system_info(version), erlang:system_info(schedulers_online)]), halt().' -noshell || true
          echo "--- gleam"; gleam --version || true
          echo "--- src/aws/services size"; ls src/aws/services 2>/dev/null | wc -l

      - name: Install diagnostics tools
        run: sudo apt-get update -qq && sudo apt-get install -y strace gdb

      - name: Run tests under strace
        # 11 stack-side probes failed identically — the SIGSEGV is
        # not from a thread-stack overflow. This iteration runs
        # gleam under `strace -f -e trace=signal` so the next
        # failure log captures the exact signal-delivery syscall
        # and the PID of the dying process. If we see SIGSEGV
        # delivered to gleam-the-Rust-binary directly, the bug is
        # in gleam itself; if it's delivered to a BEAM escript
        # subprocess, the bug is in the Erlang compile pass.
        #
        # `--summary-only` would cut noise but we need the
        # actual signal lines so leave it off and let stderr
        # capture do its job.
        run: |
          ulimit -s 131072
          ulimit -c unlimited
          set +e
          strace -f -e trace=signal -o /tmp/gleam-strace.log ./scripts/test.sh
          rc=$?
          echo "--- test.sh exit: $rc ---"
          echo "--- strace signal log (tail 80) ---"
          tail -80 /tmp/gleam-strace.log || true
          exit "$rc"
        env:
          ERL_FLAGS: "+t 16777216 +S 2:2"
          ERL_AFLAGS: "+t 16777216 +S 2:2"

  # LocalStack end-to-end tests for the v0.1 verification gate
  # (DynamoDB + S3 round-trips). Kept in a separate job so the
  # default test matrix stays fast; this job pulls + boots a
  # `localstack/localstack:3` container, runs the gated suite,
  # and tears the container down on exit. INCLUDE_LOCALSTACK=1
  # is the env flag the `test/support/localstack.gleam` harness
  # reads — without it the tests skip silently.
  localstack:
    name: LocalStack E2E
    runs-on: ubuntu-latest
    # Regenerating 409 services takes ~13 minutes on the Ubuntu
    # runner (each `gleam run -m aws_codegen` is a fresh BEAM start;
    # Linux is ~2× slower than macOS for that). Plus image pull,
    # test run, teardown — 30 min gives comfortable margin without
    # letting a genuinely-hung container linger forever.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Compute submodule cache key
        id: subs-key
        run: |
          key=$(git ls-tree HEAD vendor | awk '{print $3}' | sort | sha256sum | cut -c1-16)
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Cache vendor submodules
        id: cache-submodules
        uses: actions/cache@v4
        with:
          path: |
            .git/modules/vendor
            vendor/aws-sdk-rust
            vendor/smithy
          key: vendor-submodules-${{ steps.subs-key.outputs.key }}

      - name: Initialise sparse submodules
        if: steps.cache-submodules.outputs.cache-hit != 'true'
        run: scripts/init-submodules.sh

      - name: Install OTP and Gleam
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.0"
          gleam-version: "1.16.0"

      - name: Cache Gleam build artifacts and Hex packages
        uses: actions/cache@v4
        with:
          path: |
            build
            ~/.cache/gleam
            ~/.hex
          key: gleam-localstack-27.0-1.16.0-${{ hashFiles('manifest.toml', 'gleam.toml') }}

      - name: Cache Smithy CLI
        id: cache-smithy
        uses: actions/cache@v4
        with:
          path: .tools/smithy-cli-linux-x86_64
          key: smithy-cli-linux-x86_64-1.70.0

      - name: Download Smithy CLI
        if: steps.cache-smithy.outputs.cache-hit != 'true'
        run: |
          mkdir -p .tools
          curl -sSL -o .tools/smithy.zip \
            https://github.com/smithy-lang/smithy/releases/download/1.70.0/smithy-cli-linux-x86_64.zip
          unzip -q .tools/smithy.zip -d .tools/
          rm .tools/smithy.zip
          test -x .tools/smithy-cli-linux-x86_64/bin/smithy

      - name: Download dependencies
        run: gleam deps download

      - name: Regenerate codegen artefacts
        run: ./scripts/regen.sh

      # Pre-pull the image so the first test's `docker compose up`
      # doesn't include image-pull time in its boot budget.
      - name: Pre-pull LocalStack image
        run: docker pull --quiet localstack/localstack:3

      - name: Run gleam test (INCLUDE_LOCALSTACK=1)
        # See note in the `test` job's "Run tests" step — without
        # `+t 4194304` the BEAM segfaults under the 409-service load.
        run: ./scripts/test.sh
        env:
          INCLUDE_LOCALSTACK: "1"
          ERL_FLAGS: "+t 16777216 +S 2:2"
          ERL_AFLAGS: "+t 16777216 +S 2:2"

      # Belt-and-braces teardown: the test harness already runs
      # `docker compose down -v` via `try / after`, but if the test
      # process crashed before the after-block fired the container
      # could outlive the job step. `down -v` is idempotent.
      - name: Tear down LocalStack (always)
        if: always()
        run: docker compose -f test/support/docker-compose.yml down -v || true
