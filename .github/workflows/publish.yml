name: Publish hex packages

# Publishes aws_runtime + the per-service packages on tag push.
# Tag shape: `v0.1.0`, `v0.2.0-rc.1`, etc. — applies the same
# version to every published package so consumers can pick
# matching `aws_runtime` + `aws_<svc>` lines.
#
# Required GH secrets:
#   HEX_KEY — write-scoped hex.pm API key. Get one via
#             `gleam hex authenticate` and read it out of
#             `~/.config/gleam/auth.toml`. Passed into the
#             publish steps below as the `HEXPM_API_KEY` env
#             var that `gleam publish` reads.
#
# Manual dry-run before the first real publish:
#   ./scripts/publish.sh --dry-run

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_override:
        description: "Override version string (default: tag without leading v)"
        required: false
        type: string

jobs:
  verify:
    # Publish gate: verify each publishable package builds cleanly
    # in isolation. Cheaper than the full SDK test suite (~30 s
    # vs ~10 min) and pinned to exactly what `gleam publish` will
    # touch. Comprehensive testing is ci.yml's job — the
    # comprehensive run on every PR is what catches breakage; the
    # publish workflow only needs to confirm a green tag is
    # publishable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          gleam-version: "1.16.0"

      - name: Regenerate the per-service packages we publish
        # services/<svc>/src/aws/services/<svc>.gleam is .gitignored;
        # focused regen (re-)creates it for each service we plan to
        # publish. Keep this list in sync with PUBLISHED_SERVICES in
        # the publish step below + the verify loop right after.
        run: ./scripts/regen.sh s3 sqs dynamodb rds sesv2

      - name: Verify aws_runtime compiles
        working-directory: runtime
        run: gleam build --target erlang

      - name: Verify each published service package compiles
        # Only walks the curated PUBLISHED_SERVICES list — the other
        # services/<svc>/ directories on disk (committed gleam.toml
        # + README + LICENSE from earlier sweeps) have gitignored
        # src/ trees that the focused regen above doesn't touch, so
        # `gleam build` errors trying to canonicalise the missing
        # src/. They're left in the repo for local-dev test coverage
        # but are not part of the publish gate.
        run: |
          for svc in s3 sqs dynamodb rds sesv2; do
            echo "→ services/$svc"
            ( cd "services/$svc" && gleam build --target erlang )
          done

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          gleam-version: "1.16.0"

      - name: Compute version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version_override }}" ]; then
            echo "version=${{ github.event.inputs.version_override }}" >> "$GITHUB_OUTPUT"
          else
            # Strip leading `v` from the tag ref. v0.2.0-rc.1 → 0.2.0-rc.1
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate every published service
        # Keep this list in sync with PUBLISHED_SERVICES in
        # scripts/publish.sh (the loop iterates over that list,
        # not over services/*/).
        run: ./scripts/regen.sh s3 sqs dynamodb rds sesv2

      - name: Publish aws_runtime first
        env:
          HEXPM_API_KEY: ${{ secrets.HEX_KEY }}
        run: |
          ./scripts/publish.sh "${{ steps.version.outputs.version }}" runtime

      - name: Publish per-service packages
        env:
          HEXPM_API_KEY: ${{ secrets.HEX_KEY }}
        run: |
          ./scripts/publish.sh "${{ steps.version.outputs.version }}" services
